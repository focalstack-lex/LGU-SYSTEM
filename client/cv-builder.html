<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CV Builder · College of Engineering</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Iconify Icon Engine -->
  <script src="/vendor/iconify-icon.min.js"></script>
  <script src="/vendor/icons-bundle.js"></script>

  <!-- Global Styles -->
  <link rel="stylesheet" href="styles/main.css?v=7.2" />
  <link rel="stylesheet" href="styles/cv-builder.css?v=3.0" />

  <!-- Supabase (vendored) -->
  <script src="vendor/supabase.min.js"></script>

  <script>
    // Apply theme immediately to prevent flashing
    (function() {
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (e) { /* storage unavailable */ }
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body class="cv-builder-body" data-pane="edit">

  <header class="cv-app-header">
    <div class="cv-header-inner">
      <div class="cv-header-left">
        <a href="/index.html" class="cv-back-link" title="Return to Student Portal">
          <iconify-icon icon="solar:arrow-left-linear"></iconify-icon>
          <span>Portal</span>
        </a>
        <div class="cv-header-sep"></div>
        <div class="cv-brand-group">
          <img src="assets/coe-logo.png" alt="" class="cv-brand-logo" />
          <div class="cv-brand-titles">
            <span class="cv-brand-portal">College of Engineering</span>
            <span class="cv-brand-badge">CV Builder</span>
          </div>
        </div>
      </div>

      <div class="cv-header-right">
        <button type="button" class="cv-status" id="cv-status" data-state="loading" aria-live="polite">
          <span class="cv-status-dot" aria-hidden="true"></span>
          <span id="cv-status-text">Loading…</span>
        </button>
        <button type="button" class="btn btn-secondary cv-header-btn" id="cv-reset-btn" title="Clear every field and start over" aria-label="Reset CV">
          <iconify-icon icon="solar:restart-linear"></iconify-icon>
          <span class="cv-btn-label">Reset</span>
        </button>
        <button type="button" class="btn btn-primary cv-header-btn cv-export-btn" id="cv-print-btn" aria-label="Download PDF">
          <iconify-icon icon="solar:download-minimalistic-bold"></iconify-icon>
          <span class="cv-btn-label">Download PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Phone layout: one pane at a time -->
  <div class="cv-mobile-tabs" role="tablist" aria-label="CV builder view">
    <button type="button" role="tab" class="cv-mobile-tab active" data-pane="edit" aria-selected="true">Edit</button>
    <button type="button" role="tab" class="cv-mobile-tab" data-pane="preview" aria-selected="false">Preview</button>
  </div>

  <div class="cv-builder-container">

    <!-- LEFT PANE: editor -->
    <aside class="cv-editor" id="cv-editor">
      <form class="cv-form" id="cv-form" onsubmit="return false;" autocomplete="off" novalidate>

        <section class="cv-block">
          <h3 class="cv-block-title">Personal details</h3>
          <div class="cv-form-group">
            <label for="cv-name">Full name</label>
            <input type="text" id="cv-name" class="cv-input" data-path="full_name" maxlength="100" placeholder="e.g. Juan M. Dela Cruz" autocomplete="name" />
          </div>
          <div class="cv-form-row">
            <div class="cv-form-group">
              <label for="cv-email">Email</label>
              <input type="email" id="cv-email" class="cv-input" data-path="contact_email" maxlength="254" placeholder="you@g.cjc.edu.ph" autocomplete="email" />
            </div>
            <div class="cv-form-group">
              <label for="cv-phone">Phone</label>
              <input type="tel" id="cv-phone" class="cv-input" data-path="contact_phone" maxlength="40" placeholder="+63 912 345 6789" autocomplete="tel" />
            </div>
          </div>
          <div class="cv-form-group">
            <label for="cv-location">City / Province</label>
            <input type="text" id="cv-location" class="cv-input" data-path="location" maxlength="120" placeholder="e.g. Digos City, Davao del Sur" autocomplete="address-level2" />
          </div>
          <div class="cv-form-row">
            <div class="cv-form-group">
              <label for="cv-linkedin">LinkedIn <span class="cv-field-hint">optional</span></label>
              <input type="text" id="cv-linkedin" class="cv-input" data-path="linkedin_url" maxlength="300" placeholder="linkedin.com/in/username" inputmode="url" />
            </div>
            <div class="cv-form-group">
              <label for="cv-github">GitHub <span class="cv-field-hint">optional</span></label>
              <input type="text" id="cv-github" class="cv-input" data-path="github_url" maxlength="300" placeholder="github.com/username" inputmode="url" />
            </div>
          </div>
          <div class="cv-form-group">
            <label for="cv-portfolio">Portfolio / website <span class="cv-field-hint">optional</span></label>
            <input type="text" id="cv-portfolio" class="cv-input" data-path="portfolio_url" maxlength="300" placeholder="username.dev" inputmode="url" />
          </div>
        </section>

        <section class="cv-block">
          <h3 class="cv-block-title">Education</h3>
          <div class="cv-form-row">
            <div class="cv-form-group">
              <label for="cv-program">Program</label>
              <select id="cv-program" class="cv-input" data-path="education.program">
                <option value="">Select program…</option>
                <option value="BSCoE">BS Computer Engineering</option>
                <option value="BSCE">BS Civil Engineering</option>
                <option value="BSECE">BS Electronics Engineering</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="cv-form-group">
              <label for="cv-grad-year">Expected graduation</label>
              <input type="text" id="cv-grad-year" class="cv-input" data-path="education.grad_year" maxlength="4" inputmode="numeric" placeholder="e.g. 2028" />
            </div>
          </div>
          <div class="cv-form-group">
            <label for="cv-degree">Degree as it should appear</label>
            <input type="text" id="cv-degree" class="cv-input" data-path="education.degree" maxlength="120" placeholder="e.g. Bachelor of Science in Civil Engineering" />
          </div>
          <div class="cv-form-group">
            <label for="cv-coursework">Relevant coursework <span class="cv-field-hint">comma-separated</span></label>
            <input type="text" id="cv-coursework" class="cv-input" data-path="education.coursework" data-type="list" maxlength="400" placeholder="e.g. Fluid Mechanics, Structural Theory" />
            <div class="cv-chip-row" id="coursework-chips"></div>
          </div>
        </section>

        <section class="cv-block">
          <h3 class="cv-block-title">Summary <span class="cv-field-hint">optional, 2–3 lines</span></h3>
          <div class="cv-form-group">
            <label for="cv-summary" class="sr-only">Professional summary</label>
            <textarea id="cv-summary" class="cv-input" data-path="summary" rows="3" maxlength="600" placeholder="Who you are, what you're strongest at, and the role you're after."></textarea>
            <span class="cv-counter" data-counter-for="cv-summary"></span>
          </div>
        </section>

        <section class="cv-block">
          <h3 class="cv-block-title">Skills</h3>
          <div class="cv-form-group">
            <label for="cv-skills">Technical skills &amp; software <span class="cv-field-hint">comma-separated</span></label>
            <input type="text" id="cv-skills" class="cv-input" data-path="technical_skills" data-type="list" maxlength="600" placeholder="e.g. AutoCAD, MATLAB, Python" />
            <div class="cv-chip-row" id="skill-chips"></div>
          </div>
          <div class="cv-form-group">
            <label for="cv-other-skills">Other skills &amp; languages <span class="cv-field-hint">comma-separated</span></label>
            <input type="text" id="cv-other-skills" class="cv-input" data-path="soft_skills" data-type="list" maxlength="600" placeholder="e.g. English (fluent), Filipino, Cebuano, Technical writing" />
          </div>
        </section>

        <section class="cv-block">
          <h3 class="cv-block-title">Capstone / design project <span class="cv-field-hint">optional</span></h3>
          <div class="cv-form-group">
            <label for="cv-capstone-title">Project title</label>
            <input type="text" id="cv-capstone-title" class="cv-input" data-path="capstone_project.title" maxlength="150" placeholder="Project title" />
          </div>
          <div class="cv-form-group">
            <label for="cv-capstone-tech">Tools &amp; technologies</label>
            <input type="text" id="cv-capstone-tech" class="cv-input" data-path="capstone_project.tech_stack" maxlength="200" placeholder="e.g. ESP32, LoRa, ETABS" />
          </div>
          <div class="cv-form-group">
            <label for="cv-capstone-abstract">What it does and what you did</label>
            <textarea id="cv-capstone-abstract" class="cv-input" data-path="capstone_project.abstract" rows="3" maxlength="600" placeholder="Problem, your part in it, and the result."></textarea>
            <span class="cv-counter" data-counter-for="cv-capstone-abstract"></span>
          </div>
        </section>

        <!-- Verified college records (only shown when the student has any) -->
        <section class="cv-block" id="verified-block" hidden>
          <h3 class="cv-block-title">Verified college records</h3>
          <p class="cv-block-note">Roles and events on file with the College of Engineering. Tick the ones you want on your CV.</p>
          <div id="verified-root"></div>
        </section>

        <!-- Experience / Leadership / Certifications / Awards - generated by cv-builder.js -->
        <div id="entries-root"></div>

      </form>
    </aside>

    <!-- RIGHT PANE: live preview -->
    <main class="cv-preview-wrapper" id="cv-preview">
      <div class="cv-toolbar">
        <div class="cv-toolbar-title">
          <iconify-icon icon="solar:document-text-bold" class="cv-toolbar-icon"></iconify-icon>
          <span>Preview</span>
          <span class="cv-toolbar-badge">US Letter · 1 page</span>
        </div>
        <span class="cv-length" id="cv-length" role="status"></span>
      </div>

      <div class="cv-paper-frame" id="cv-paper-frame">
        <article class="cv-paper" id="cv-paper" aria-label="CV preview"></article>
      </div>
    </main>

  </div>

  <div class="toast hidden" id="cv-toast" role="status" aria-live="polite">
    <span id="cv-toast-icon" aria-hidden="true"></span>
    <span id="cv-toast-message"></span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cv-builder.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { CvBuilder.init(); });
  </script>
</body>
</html>
