<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credential Verification - COE LGU System</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="vendor/iconify-icon.min.js"></script>
  <script src="vendor/icons-bundle.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .verify-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #15803d;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .student-name {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 0 4px 0;
    }
    .student-course {
      color: #3b82f6;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 20px;
    }
    .verified-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .verified-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      background: #f8fafc;
    }
    .verified-item-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
    }
    .verified-item-sub {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 2px;
    }
    .footer-stamp {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: #94a3b8;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="verify-card" id="verify-container">
    <div style="text-align: center; padding: 20px;">
      <iconify-icon icon="line-md:loading-loop" style="font-size: 2.5rem; color: #3b82f6;"></iconify-icon>
      <p style="color: #64748b; margin-top: 10px;">Verifying student credentials with College database...</p>
    </div>
  </div>

  <script src="js/cv-verify.js"></script>
</body>
</html>
